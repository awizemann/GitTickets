name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    # macos-14 is deprecated by GitHub and its newest Xcode is 16.2 (Swift 6.0),
    # the compiler that produced the concurrency breakage this release fixes.
    # macos-15 is GA and is the ONLY current image that still ships an iOS 18.x
    # simulator runtime (18.5 / 18.6) — macos-26 ships iOS 26.x only. Since
    # Package.swift declares an iOS 18 floor, macos-15 lets us test *at* the
    # floor instead of only above it. Source: actions/runner-images
    # images/macos/macos-15-Readme.md and the image-label table in that repo's
    # README (checked 2026-07-25).
    runs-on: macos-15
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A generic destination is enough to compile: it resolves without
          # booting or even installing a simulator, so the build step can't fail
          # for reasons unrelated to the code.
          - name: macOS
            build-destination: "generic/platform=macOS"
            test-destination: "platform=macOS"
          # Only the test step needs a concrete, bootable simulator. iPhone 16 is
          # present on the 18.5/18.6 runtimes per the macos-15 image README; 18.6
          # is the newest iOS 18.x there and satisfies the iOS 18 deployment
          # floor. If a future image drops this runtime the job fails loudly with
          # an unresolvable-destination error rather than silently testing
          # something else — that is intentional.
          - name: iOS
            build-destination: "generic/platform=iOS Simulator"
            test-destination: "platform=iOS Simulator,name=iPhone 16,OS=18.6"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # PINNED, deliberately. This was `latest-stable`, which silently moved
          # the compiler under us and is exactly why a Swift 6.0 concurrency
          # error sat unnoticed for weeks: the toolchain changed without any
          # commit to blame. A pin makes compiler changes an explicit, reviewable
          # edit to this line.
          #
          # 26.3 is the newest Xcode on macos-15 and the closest available match
          # to the 26.x toolchains used locally, so CI and developer machines
          # disagree as little as possible. Bump this on purpose, in its own PR.
          xcode-version: '26.3'

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: |
          xcodebuild -scheme GitTickets \
            -destination "${{ matrix.build-destination }}" \
            -skipPackagePluginValidation \
            build

      - name: Test
        # `xcodebuild test` does NOT forward the job's environment into the
        # XCTest process, so the `CI=true` GitHub sets for every step is
        # invisible to the tests themselves (verified: without this, the
        # snapshot suite's CI guard never fires and the macOS job fails with 6
        # record-and-fail errors). The `TEST_RUNNER_` prefix is the supported
        # way through: xcodebuild strips it and injects the remainder into the
        # test process, so the tests see plain `CI=true`. Keep this in sync with
        # the guard in SnapshotTests.setUpWithError().
        env:
          TEST_RUNNER_CI: 'true'
        run: |
          xcodebuild test -scheme GitTickets \
            -destination "${{ matrix.test-destination }}" \
            -skipPackagePluginValidation \
            -enableCodeCoverage YES
